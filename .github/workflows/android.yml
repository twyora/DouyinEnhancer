name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
    paths-ignore:
      - ".github/**"
      - "*.md"
      - "doc/*"
      - "LICENSE"

permissions:
  contents: read
  actions: write
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup Java JDK
        uses: actions/setup-java@v5.2.0
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build with Gradle and Sign
        run: |
          echo ${{ secrets.SIGNING_KEY }} | base64 -d > keystore.jks
          if [[ ${{ github.ref }} == refs/tags/v* ]]; then
            bash ./gradlew :app:assembleAppRelease
            bash ./gradlew :app:assembleAppRelease
            echo "APK_FILE=$(find app/build/outputs/apk/App/release/ -name '*.apk' | head -n 1)" >> $GITHUB_ENV
            echo "ARTIFACT_NAME=DouyinEnhancer_App_Release" >> $GITHUB_ENV
            echo "Building Type: App Release Version" >> $GITHUB_STEP_SUMMARY
          else
            bash ./gradlew :app:assembleCIRelease
            bash ./gradlew :app:assembleCIRelease
            echo "APK_FILE=$(find app/build/outputs/apk/CI/release/ -name '*.apk' | head -n 1)" >> $GITHUB_ENV
            echo "ARTIFACT_NAME=DouyinEnhancer_CI_Release" >> $GITHUB_ENV
            echo "Building Type: CI Release Version" >> $GITHUB_STEP_SUMMARY
          fi
        env:
          KEYSTORE_PATH: "../keystore.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.APK_FILE }}

      - name: Package Mapping Files
        run: |
          if [ -d app/build/outputs/mapping ]; then
            cd app/build/outputs/mapping
            zip -r "$RUNNER_TEMP/mapping.zip" .
            echo "MAPPING_ZIP=$RUNNER_TEMP/mapping.zip" >> "$GITHUB_ENV"
          else
            echo "No mapping directory found, skipping."
          fi

      - name: Post Mapping to Telegram
        if: ${{ env.MAPPING_ZIP != '' }}
        run: |
          ESCAPED=`python3 -c 'import json,os,urllib.parse; msg = json.dumps("Mapping for " + os.environ["REF_NAME"] + " (" + os.environ["COMMIT_SHA"] + ")"); print(urllib.parse.quote(msg[:1024]))'`
          curl -v "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMediaGroup?chat_id=${TG_CHAT_ID_MAPPING}&media=%5b%7b%22type%22%3a%22document%22%2c+%22media%22%3a%22attach%3a%2f%2fmapping%22%2c%22caption%22%3a${ESCAPED}%7d%5d" -F mapping="@${{ env.MAPPING_ZIP }}"
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID_MAPPING: ${{ secrets.TG_CHAT_ID_MAPPING }}
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}

      - name: Get Author Name
        run: |
          AUTHOR="$COMMIT_AUTHOR"
          
          PR_NUM=$(echo "$COMMIT_MESSAGE" | grep -oE '#[0-9]+' | head -n 1 | tr -d '#')
          if [ -n "$PR_NUM" ]; then
            PR_AUTHOR=$(gh pr view "$PR_NUM" --json author --jq '.author.login' 2>/dev/null)
            [ -n "$PR_AUTHOR" ] && AUTHOR="$PR_AUTHOR"
          fi
          
          echo "AUTHOR_NAME=$AUTHOR" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

      # referenced from [RestoreSplashScreen](https://github.com/GSWXXN/RestoreSplashScreen/blob/master/.github/workflows/android.yml)
      - name: Post Artifacts to Telegram
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          ESCAPED=`python3 -c 'import json,os,urllib.parse; msg = json.dumps(os.environ["COMMIT_MESSAGE"]); print(urllib.parse.quote(msg if len(msg) <= 1024 else json.dumps(os.environ["COMMIT_URL"])))'`
          curl -v "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMediaGroup?chat_id=${TG_CHAT_ID}&media=%5b%7b%22type%22%3a%22document%22%2c+%22media%22%3a%22attach%3a%2f%2fci%22%2c%22caption%22%3a${ESCAPED}%7d%5d" -F ci="@${{ env.APK_FILE }}"
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          COMMIT_MESSAGE: |+
            New push to GitHub\!
            ```
            ${{ github.event.head_commit.message }}
            ```by `${{ env.AUTHOR_NAME }}`
            
            See commit detail [here](${{ github.event.head_commit.url }})
            See build detail [here](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          COMMIT_URL: ${{ github.event.head_commit.url }}

      - name: Display APK Hashes
        run: |
          apk=${{ env.APK_FILE }}
          echo "### APK Hashes" >> $GITHUB_STEP_SUMMARY
          echo "| Hash Type | Hash Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA256 | \`$(sha256sum $apk | awk '{ print $1 }')\` |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA1 | \`$(sha1sum $apk | awk '{ print $1 }')\` |" >> $GITHUB_STEP_SUMMARY
          echo "| MD5 | \`$(md5sum $apk | awk '{ print $1 }')\` |" >> $GITHUB_STEP_SUMMARY